# docker-compose.cloud-fleet.yml
# Runs an industrial multi-factory fleet of 5 robot controllers in isolated Docker containers,
# communicating with the production HiveMQ Cloud broker.

services:
  robot-scara:
    build:
      context: ./simulator
    volumes:
      - ./keys:/app/keys:ro
    environment:
      - MQTT_BROKER=${CLOUD_MQTT_BROKER:-ssl://<cluster-id>.s1.eu.hivemq.cloud:8883}
      - MQTT_USERNAME=${CLOUD_MQTT_USERNAME:-<mqtt-username>}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_USE_TLS=true
      - DEVICE_ID=scara-bkk-01
      - HW_MODEL=scara-v1
      - FACTORY_ID=factory-bkk-01
    restart: unless-stopped

  robot-delta:
